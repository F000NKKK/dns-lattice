name: CI

# Cross-platform baseline CI: the all-feature matrix covers the implemented
# upstream transports and inbound listeners on the three supported platforms.
# Stage 0.6 still adds hardening work such as coverage, fuzz/property, and
# dedicated privileged jobs; see net-lattice's workflow for that pattern.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-matrix:
    name: feature matrix (${{ matrix.os }}, ${{ matrix.feature.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        feature:
          - name: no-default-features
            cargo_args: --no-default-features
          - name: dot
            cargo_args: --no-default-features --features dot
          - name: doh
            cargo_args: --no-default-features --features doh
          - name: doq
            cargo_args: --no-default-features --features doq
          - name: all-features
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo check -p dns-lattice ${{ matrix.feature.cargo_args }}
        run: cargo check -p dns-lattice ${{ matrix.feature.cargo_args }}

      - name: cargo test -p dns-lattice ${{ matrix.feature.cargo_args }}
        run: cargo test -p dns-lattice ${{ matrix.feature.cargo_args }}

      # `--all-features` alone can hide links to items gated behind a
      # different feature. Keep rustdoc warnings fatal for every supported
      # feature selection so each published API surface is checked.
      - name: cargo doc -D warnings -p dns-lattice ${{ matrix.feature.cargo_args }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p dns-lattice ${{ matrix.feature.cargo_args }}

  package-and-release-smoke:
    name: package and release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      # Build and list each publishable archive from the checkout. This
      # checks the crate-local README/package boundary reproducibly without
      # publishing or contacting crates.io.
      - name: cargo package --workspace --allow-dirty --list
        run: cargo package --workspace --allow-dirty --list

      # The script stubs git/GitHub/crates.io inside a disposable workspace;
      # this is a deterministic regression test, not a release action.
      - name: release automation regression
        run: bash scripts/test_gh_release.sh

  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check --workspace --all-features
        run: cargo check --workspace --all-features

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

      - name: cargo doc --no-deps --workspace --all-features
        run: cargo doc --no-deps --workspace --all-features

  # Compile and lint gate for the unpublished resolver benchmark harness, a
  # standalone workspace outside `--workspace` above (it pulls in hickory,
  # which must stay out of the published crates' graph). It runs on every
  # push so the harness keeps building against the current crates; the
  # benchmarks themselves only run on demand.
  bench-resolver:
    name: bench-resolver (check)
    runs-on: ubuntu-latest
    # The standalone workspace would otherwise build into
    # bench/resolver/target/, which the root .gitignore does not cover.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/bench-resolver
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rust-cache's workspace mapping is `<workspace> -> <target dir>`,
      # relative to the workspace, so it saves the directory set above.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench-resolver
          workspaces: bench/resolver -> ../../target/bench-resolver

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path bench/resolver/Cargo.toml

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --manifest-path bench/resolver/Cargo.toml --all-targets -- -D warnings

      # Wire-format tests, cross-checked against both libraries' decoders.
      - name: cargo test
        run: cargo test --manifest-path bench/resolver/Cargo.toml

      - name: cargo bench --no-run
        run: cargo bench --manifest-path bench/resolver/Cargo.toml --no-run

      - name: bash -n and shellcheck scripts/bench-resolver.sh
        run: |
          bash -n scripts/bench-resolver.sh
          shellcheck scripts/bench-resolver.sh
