name: CI

# Cross-platform baseline CI: the all-feature matrix covers the implemented
# upstream transports and inbound listeners on the three supported platforms.
# Stage 0.6 still adds hardening work such as coverage, fuzz/property, and
# dedicated privileged jobs; see net-lattice's workflow for that pattern.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check --workspace --all-features
        run: cargo check --workspace --all-features

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

      - name: cargo doc --no-deps --workspace --all-features
        run: cargo doc --no-deps --workspace --all-features
