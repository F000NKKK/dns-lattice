[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
repository = "https://github.com/F000NKKK/dns-lattice"
homepage = "https://github.com/F000NKKK/dns-lattice"
documentation = "https://docs.rs/dns-lattice"
authors = ["DNS Lattice Contributors", "F000NK"]
categories = ["network-programming", "os"]
keywords = ["cross-platform","rust","networking","dns","systems"]

[workspace.dependencies]
dns-lattice-core = { path = "crates/dns-lattice-core", version = "0.5.0" }

dns-lattice-model = { path = "crates/dns-lattice-model", version = "0.5.0" }

dns-lattice = { path = "crates/dns-lattice", version = "0.5.0" }

async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["net", "time", "rt", "macros", "io-util"] }

# DoT (dns-lattice `dot` feature, RFC 7858). `aws-lc-rs` is enabled
# directly here (not left to arrive transitively via `doh`'s
# `hyper-rustls` or `doq`'s `quinn`) so `rustls` has a process-level
# `CryptoProvider` even when the `dot` Cargo feature is enabled on its
# own — without it, any TLS handshake panics at runtime with "Could not
# automatically determine the process-level CryptoProvider" (this
# workspace already standardizes on `aws-lc-rs`, not `ring`, per
# `DL-A-14`/ADR-0013's rationale for `doq`'s matching choice).
rustls = { version = "0.23", default-features = false, features = ["tls12", "std", "aws-lc-rs"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = "1"

# DoH (dns-lattice `doh` feature, RFC 8484)
hyper = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots", "aws-lc-rs"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
base64 = "0.23"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# DoQ (dns-lattice `doq` feature, RFC 9250). `rustls-aws-lc-rs` shares this
# workspace's already-pinned `rustls`/`aws-lc-rs` crypto-provider line
# (pulled in by `doh`'s `hyper-rustls` dependency) rather than also
# compiling in `ring` via quinn's default `rustls-ring` feature. See
# `DL-A-14` (ADR-0013).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }

# Test-only: generates a self-signed certificate/key pair for the loopback
# DoT/DoH/DoQ TLS test fixtures (dns-lattice `dot`/`doh`/`doq` feature
# tests).
rcgen = "0.14"
