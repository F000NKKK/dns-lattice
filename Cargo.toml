[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
repository = "https://github.com/F000NKKK/dns-lattice"
homepage = "https://github.com/F000NKKK/dns-lattice"
documentation = "https://docs.rs/dns-lattice"
authors = ["DNS Lattice Contributors", "F000NK"]
categories = ["network-programming", "os"]
keywords = ["cross-platform","rust","networking","dns","systems"]

[workspace.dependencies]
dns-lattice-core = { path = "crates/dns-lattice-core", version = "1.2.0" }

dns-lattice-model = { path = "crates/dns-lattice-model", version = "1.2.0" }

dns-lattice = { path = "crates/dns-lattice", version = "1.2.0" }

async-trait = "0.1.92"
async-channel = "2.5"
event-listener = "5.4.2"
futures-channel = "0.3.34"
tokio = { version = "1.53.1", default-features = false, features = ["net", "time", "rt", "macros", "io-util", "sync"] }

# TLS providers are selected by dns-lattice's Cargo features.
rustls = { version = "0.23.45", default-features = false, features = ["tls12", "std"] }
rustls-pki-types = "1.15.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
webpki-roots = "1.0.9"

# DoH (dns-lattice `doh` feature, RFC 8484)
hyper = "1.11.1"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots"] }
http = "1.5.0"
http-body-util = "0.1.5"
# `Service` trait of the counting connector wrapped around `hyper-rustls`'s
# connector (already a dependency of `hyper-util` and `hyper-rustls`).
tower-service = "0.3.3"
bytes = "1.12.1"
base64 = "0.23.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# DoQ/DoH3 use the same selected TLS provider as rustls.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio"] }

# Test-only: generates a self-signed certificate/key pair for the loopback
# DoT/DoH/DoQ TLS test fixtures (dns-lattice `dot`/`doh`/`doq` feature
# tests).
rcgen = "0.14.10"
