[package]
name = "dns-lattice-model"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dns-lattice-model"
categories.workspace = true
keywords.workspace = true
description = "The DNS message, zone/domain matcher, and policy model for DNS Lattice. No networking I/O, no OS dependency."
readme = "README.md"

[features]
dnssec-sha2 = ["dep:sha2"]

[dependencies]
dns-lattice-core = { workspace = true }
sha2 = { version = "0.10.9", optional = true }
