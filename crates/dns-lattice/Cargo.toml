[package]
name = "dns-lattice"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Programmable Rust DNS control plane for the Lattice networking stack: split DNS, Fake IP, address pools, and dynamic routing hooks."
readme = "README.md"

[features]
# DNS-over-TLS (RFC 7858) upstream backend. Default off: the baseline
# UDP/TCP build carries no TLS dependency weight unless explicitly opted
# into. See `DL-A-13` (ADR-0012).
dot = ["dep:rustls", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:webpki-roots"]
# DNS-over-HTTPS (RFC 8484) upstream backend. Default off, independent of
# `dot`. See `DL-A-13` (ADR-0012).
doh = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http",
    "dep:http-body-util",
    "dep:bytes",
    "dep:base64",
    "dep:h3",
    "dep:h3-quinn",
    "dep:quinn",
]
# DNS-over-QUIC (RFC 9250) upstream backend. Default off, independent of
# `dot`/`doh`. See `DL-A-14` (ADR-0013).
doq = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dependencies]
dns-lattice-core = { workspace = true }
dns-lattice-model = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

hyper = { workspace = true, optional = true, features = ["server"] }
hyper-util = { workspace = true, optional = true, features = ["server", "server-auto"] }
hyper-rustls = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

quinn = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
rcgen = { workspace = true }
